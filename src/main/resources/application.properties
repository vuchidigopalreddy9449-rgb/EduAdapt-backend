spring.application.name=EduAdapt

# PostgreSQL. Render injects these values from the managed database.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:edadapt}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# OpenAI question generation (the API key must stay on the backend)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# Bound uploaded teacher files before storing them in PostgreSQL.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
