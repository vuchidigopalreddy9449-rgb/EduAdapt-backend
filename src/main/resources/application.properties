spring.application.name=EduAdapt

# MySQL: defaults support local development; set MYSQL_SSL_MODE=REQUIRED for Aiven.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:edadapt}?sslMode=${MYSQL_SSL_MODE:DISABLED}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# OpenAI question generation (the API key must stay on the backend)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# Bound uploaded teacher files before storing them in MySQL.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
